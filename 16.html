<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naol Editer</title>
<style>
:root{--ac:#25f4ee;--pk:#fe2c55;--mu:#8a8a8e}
*{box-sizing:border-box;margin:0}
body{background:#000;color:#fff;font:13px system-ui,sans-serif;max-width:560px;margin:auto;min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
body.open{padding-bottom:calc(70px + 44vh)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.logo{font:900 18px system-ui;background:linear-gradient(90deg,var(--ac),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{display:flex;gap:8px;align-items:center}
.q{background:#1c1c1e;color:#fff;border:0;border-radius:8px;padding:8px}
.exp{background:var(--ac);color:#000;border:0;border-radius:8px;padding:8px 16px;font-weight:800}
#cv{display:block;margin:auto;width:auto;max-width:100%;max-height:42vh;background:#000}
.ctrl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--mu)}
.ic{background:none;border:0;color:#fff;font-size:20px;padding:4px 10px;cursor:pointer}
.tlw{position:relative;padding:6px 0}
.ph{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;z-index:3;pointer-events:none}
.plus{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:8px;background:#fff;color:#000;font-size:26px;display:grid;place-items:center;z-index:4;cursor:pointer}
#sc{overflow-x:auto;padding:0 50%;scrollbar-width:none}
#sc::-webkit-scrollbar{display:none}
#tin{position:relative;min-width:1px}
.r1{display:flex;height:48px}
.clip{flex:none;height:48px;background:#2a2a2e;border-right:2px solid #000;font-size:11px;overflow:hidden;white-space:nowrap;padding:4px;border-radius:6px;color:#fff;text-shadow:0 1px 3px #000}
.clip.on{outline:2px solid #fff;outline-offset:-2px}
.r2,.r3{position:relative;height:26px;margin-top:4px}
.ab{position:absolute;height:24px;border-radius:5px;font-size:11px;padding:4px 6px;overflow:hidden;white-space:nowrap;cursor:pointer}
.tx{background:#7a3cff}.tx.on{outline:2px solid #fff}.mu{background:#0a8f8a}.sf{background:#c2410c}
.act{display:none}
.rul{display:flex;height:16px;font-size:10px;color:#8a8a8e;overflow:hidden}
.rul span{flex:none;width:60px;border-left:1px solid #333;padding-left:2px}
.b{background:#2a2a2e;color:#fff;border:0;border-radius:8px;padding:8px 12px;font:600 12px system-ui;cursor:pointer;margin:3px;display:inline-block}
.b:active{background:#3a3a40}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0}
.h{color:var(--ac);font-weight:700;margin:12px 0 4px}
.m{color:var(--mu);margin:8px 0}
#sheet{display:none;position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:calc(62px + env(safe-area-inset-bottom));max-height:44vh;overflow:auto;background:#1c1c1e;border-radius:16px 16px 0 0;padding:4px 12px 12px;z-index:9;box-shadow:0 -10px 30px #000a}
.sh{text-align:center;position:sticky;top:0;background:#1c1c1e;z-index:2}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;display:flex;overflow-x:auto;background:#000;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nb{flex:1 0 64px;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:11px;cursor:pointer}
.nb i{font-style:normal;font-size:20px}.nb.on{color:#fff}
label.r{display:grid;grid-template-columns:92px 1fr 40px;gap:6px;align-items:center;margin:7px 0}
label.r span{color:var(--mu)}
label.r input[type=range]{accent-color:var(--ac)}
label.r input[type=text],label.r select{grid-column:2/4;width:100%;background:#0d0d0e;color:#fff;border:1px solid #333;border-radius:6px;padding:6px}
label.r input[type=color]{width:100%;height:30px;border:0;background:none;grid-column:2/4}
output{font-size:11px;color:var(--mu)}
#st{position:fixed;top:54px;left:0;right:0;text-align:center;z-index:20;pointer-events:none;background:#000c;padding:6px}
#st:empty{display:none}
.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:50}
.mc{background:#1c1c1e;padding:20px;border-radius:16px;width:min(340px,90vw)}
.mc h3{margin-bottom:6px}
.mc .b{display:block;width:100%;margin:8px 0;padding:12px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
.sp{background:#d9437a}.sp.on{outline:2px solid #fff}
</style>
</head>
<body>

<div class="top">
  <div class="logo">Naol Editer</div>
  <div class="tr">
    <select id="qsel" class="q">
      <option value="720">720p</option>
      <option value="1080" selected>1080p HD</option>
      <option value="1440">2K</option>
      <option value="2160">4K Ultra HD</option>
    </select>
    <button id="ex" class="exp">Export</button>
  </div>
</div>

<div id="st"></div>

<canvas id="cv"></canvas>

<div class="ctrl">
  <span id="tc">0:00 / 0:00</span>
  <button id="pp" class="ic">▶</button>
  <button id="un" class="ic">↶</button>
  <button id="re" class="ic">↷</button>
</div>

<div class="tlw">
  <div class="ph"></div>
  <label for="file" class="plus">＋</label>
  <input type="file" id="file" multiple accept="video/*,image/*,audio/*" style="display:none">
  <div id="sc"><div id="tin"></div></div>
</div>

<div style="padding:4px 12px;display:flex;gap:4px;overflow-x:auto;">
  <button id="sp" class="b">✂ Split</button>
  <button id="fr" class="b">❄ Freeze</button>
  <button id="sn" class="b">📷 Frame</button>
  <button id="tx" class="b">T Add text</button>
</div>

<div id="sheet">
  <div class="sh" onclick="sheet=false;panel()">⌄</div>
  <div id="pan"></div>
</div>

<nav id="nav"></nav>

<svg style="display:none">
  <filter id="sharp">
    <feConvolveMatrix id="sharpMatrix" kernelMatrix="0 0 0 0 1 0 0 0 0" />
  </filter>
</svg>

<script>

/* ---------- WebGL setup ---------- */

const FS0=`
varying vec2 vUv;
uniform sampler2D uTex,uPrev;
uniform vec2 uPx,uSz;
uniform vec3 uGrid;
uniform float uSpat,uTemp,uChr,uDeb,uBand,uDesp,uSkin,uTempOn,uSeed;
float L(vec3 c){return dot(c,vec3(.299,.587,.114));}

   float a=float(i)*1.0471976+(i<6?0.:.5);

  float d=length(col-pv);
  col=mix(col,pv,uTemp*.75*(1.-smoothstep(.04,.16,d)));

const FSL=`
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uIn,uOut,uDir;
uniform float uRing;

  float k=k0+float(i);
  float w=lz(k+.5-s);

}`;

const FSF=`
varying vec2 vUv;
uniform sampler2D uTex,uSrc;
uniform vec2 uPx;
uniform vec3 uGain;
uniform float uAspect,uScale,uSplit,uAA,uSharp,uDet,uClar,uGrain,uEx,uCon,uShd,uHil,uHaze,uLow,uBp,uWp,uGm,uTmp,uVib,uSat,uSkin,uLens,uCA,uVig,uAwb,uSeed;
float L(vec3 c){return dot(c,vec3(.299,.587,.114));}

float skinM(vec3 c){float y=L(c),cb=.5-.1687*c.r-.3313*c.g+.5*c.b,cr=.5+.5*c.r-.4187*c.g-.0813*c.b;

let P0,PL,PF,buf;
function prog(fs){

 gl.bindAttribLocation(p,0,'aP');gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
 return{p,u:{}}}

 if(!gl)throw new Error('no webgl');

 buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

 Q.ok=true;

const ul=(pr,n)=>pr.u[n]!==undefined?pr.u[n]:(pr.u[n]=gl.getUniformLocation(pr.p,n));

function mkT(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);

 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t}
function mkR(w,h){const t=mkT();gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);

const bindT=(u,t)=>{gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t)};
function pass(pr,target,w,h,fn){gl.bindFramebuffer(gl.FRAMEBUFFER,target?target.f:null);gl.viewport(0,0,w,h);gl.useProgram(pr.p);

/* ---------- run the whole pipeline ---------- */
function qrun(st,src,v,scale,tgt,o){
 o=o||{};
 const W=src.width,H=src.height;
 let OW=Math.round(W*scale),OH=Math.round(H*scale);

 OW&=~1;OH&=~1;if(OW<W)OW=W;if(OH<H)OH=H;

   f1(P0,'uSpat',v.spat/100);f1(P0,'uTemp',v.temp/100);f1(P0,'uChr',v.chr/100);f1(P0,'uDeb',v.deb/100);
   f1(P0,'uBand',v.band/100);f1(P0,'uDesp',v.desp/100);f1(P0,'uSkin',v.skin/100);f1(P0,'uTempOn',tOn);f1(P0,'uSeed',seed)});

 }
 let target=null;

 let dx=0,dy=0;const vals=new Float32Array(n);

  let sxx=0,sxy=0,syy=0,bx=0,by=0,mi=0,k=0;
  for(let y=-R;y<=R;y++)for(let xx=-R;xx<=R;xx++){vals[k]=bil(F,cx+dx+xx,cy+dy+y);mi+=vals[k++]}
  mi/=n;k=0;
  for(let y=-R;y<=R;y++)for(let xx=-R;xx<=R;xx++){
   const X=cx+dx+xx,Y=cy+dy+y,gx=(bil(F,X+1,Y)-bil(F,X-1,Y))/2,gy=(bil(F,X,Y+1)-bil(F,X,Y-1))/2,e=(p[k]-mt)-(vals[k]-mi);
   sxx+=gx*gx;sxy+=gx*gy;syy+=gy*gy;bx+=gx*e;by+=gy*e;k++}

/* ---- 1-D constant-velocity Kalman filter (state: pos, vel; time unit = one tracking step) ---- */
const mkK=p=>({p,v:0,a:4,b:0,c:25});

/* ---- pro tracker state ---- */
function P4init(F,px,py,R,S,ultra){
 const main=initTrack(F,px,py,R,S),sats=[],d=R*1.7,r=Math.max(5,Math.round(R*.5)),
  offs=[[-1,-1],[1,-1],[1,1],[-1,1]];

 offs.forEach(([a,b])=>{const ox=a*d,oy=b*d,sx=Math.round(px+ox),sy=Math.round(py+oy);
  if(sx-r-2>=0&&sy-r-2>=0&&sx+r+2<F.W&&sy+r+2<F.H){
   const T=prepT(patchOf(F,sx,sy,r),r),p=T.p;let m=0;for(let i=0;i<p.length;i++)m+=p[i];m/=p.length;let v=0;for(let i=0;i<p.length;i++)v+=(p[i]-m)*(p[i]-m);v=Math.sqrt(v/p.length);
   if(v>4)sats.push({ox,oy,R:r,T,s:0,on:0,trust:0,dead:0,hx:sx,hy:sy})}});
 return{R,S,T0:main.T0,Tc:main.Tc,sats,lost:0,scale:1,rot:0,dis:0,avgS:.9,pos:{x:px,y:py},kx:mkK(px),ky:mkK(py),Q:(S*.15)*(S*.15)+.5}}
function P4step(st,F){
 const kx=st.kx,ky=st.ky,R=st.R;kPred(kx,st.Q);kPred(ky,st.Q);
 const px=clamp(kx.p,R,F.W-R-1),py=clamp(ky.p,R,F.H-R-1),S=st.S*(1+Math.min(st.lost,8)*.35);

 if(rm.s<.6&&st.lost>=3){const g=searchT(F,st.T0,F.W/2,F.H/2,Math.max(F.W,F.H));if(g.s>rm.s&&g.s>.65)rm=g}

  mainOk=rm.s>=.45&&(rm.s>=st.avgS*.72||near),strong=rm.s>=.75,bx=mainOk?rm.x:px,by=mainOk?rm.y:py,co=Math.cos(st.rot),si=Math.sin(st.rot),cand=[],hits=[];
 if(mainOk)cand.push({x:rm.x,y:rm.y,w:2.2*rm.s,m:1});
 /* satellites: must EARN trust by staying locked to the main target while it is strong
    (static background patches fail this and are dropped); only trusted ones may vote when main is weak */
 for(const s of st.sats){
  if(s.dead){s.on=0;continue}
  if(!strong&&s.trust<3){s.on=0;continue}
  const vx=(s.ox*co-s.oy*si)*st.scale,vy=(s.ox*si+s.oy*co)*st.scale,ex=bx+vx,ey=by+vy;
  if(ex<s.R+2||ey<s.R+2||ex>F.W-s.R-3||ey>F.H-s.R-3){s.on=0;continue}
  const r=searchT(F,s.T,ex,ey,strong?Math.max(4,R*.28):Math.max(6,S*.45));s.s=r.s;s.on=r.s>=.6;
  if(strong){if(s.on)s.trust=Math.min(s.trust+1,8);else{s.trust-=1;if(s.trust<-4)s.dead=1}}
  if(s.on){s.hx=r.x;s.hy=r.y;hits.push(s);cand.push({x:r.x-vx,y:r.y-vy,w:s.trust>=3?r.s:.5*r.s})}}
 let ok=false,q=0,x=px,y=py,mainIn=false;
 if(cand.length){
  const mx=wmed(cand.map(c=>({v:c.x,w:c.w}))),my=wmed(cand.map(c=>({v:c.y,w:c.w}))),thr=Math.max(2.5,R*.3);
  let sx=0,sy=0,sw=0,inl=0;
  for(const c of cand)if(Math.hypot(c.x-mx,c.y-my)<=thr){sx+=c.x*c.w;sy+=c.y*c.w;sw+=c.w;inl++;if(c.m)mainIn=true}
  if(sw>0){x=sx/sw;y=sy/sw;q=mainOk&&mainIn?rm.s:(inl>=2?.55:.5);ok=true;if(Math.hypot(x-px,y-py)>S*1.7&&q<.7)ok=false}}

  if(mainOk&&mainIn&&rm.s>=.6){const lk=lkRefine(F,st.Tc.p,R,x,y);if(lk&&Math.hypot(lk.dx,lk.dy)<1.6){x+=lk.dx;y+=lk.dy}}

  const rN=Math.pow(.5+(1-q)*9,2);kUpd(kx,x,rN);kUpd(ky,y,rN);

  st.pos={x:clamp(ox,R,F.W-R-1),y:clamp(oy,R,F.H-R-1)};st.lost=0;if(mainOk&&mainIn)st.avgS=st.avgS*.9+rm.s*.1;
  if(q>.8&&mainIn){const np=patchOf(F,clamp(Math.round(x),R,F.W-R-1),clamp(Math.round(y),R,F.H-R-1),R),p=st.Tc.p;for(let i=0;i<p.length;i++)p[i]=.9*p[i]+.1*np[i];st.Tc=prepT(p,R)}
  for(const s of hits)if(s.s>.85){const np=patchOf(F,clamp(Math.round(s.hx),s.R,F.W-s.R-1),clamp(Math.round(s.hy),s.R,F.H-s.R-1),s.R),p=s.T.p;for(let i=0;i<p.length;i++)p[i]=.92*p[i]+.08*np[i];s.T=prepT(p,s.R)}
 }else{st.lost++;kx.v*=.85;ky.v*=.85;st.pos={x:px,y:py};q=0}
 return{x:st.pos.x,y:st.pos.y,q:ok?q:0,ok,sc:st.scale,hits}}

/* ---- clean-up: outlier jumps, gap filling ---- */
function cleanTrack(a){
 const n=a.length;if(n<5)return a;const res=a.map(p=>({...p}));
 for(let i=1;i<n-1;i++){const xs=[],ys=[];for(let j=-3;j<=3;j++){const q=a[clamp(i+j,0,n-1)];xs.push(q.x);ys.push(q.y)}
  const mx=med(xs),my=med(ys);if(a[i].q<.7&&Math.hypot(a[i].x-mx,a[i].y-my)>.05){res[i].x=mx;res[i].y=my;res[i].q=Math.min(res[i].q,.3)}}

  let j=i;while(j<n&&res[j].q<.3)j++;
  const L=i-1,Rr=j<n?j:-1;
  for(let k=i;k<j;k++){
   if(L>=0&&Rr>=0&&res[Rr].t-res[L].t<=1.5){const u=(res[k].t-res[L].t)/((res[Rr].t-res[L].t)||1);res[k].x=res[L].x+(res[Rr].x-res[L].x)*u;res[k].y=res[L].y+(res[Rr].y-res[L].y)*u;res[k].s=(res[L].s||.1)+((res[Rr].s||.1)-(res[L].s||.1))*u;res[k].q=.35}
   else if(L>=0){res[k].x=res[L].x;res[k].y=res[L].y;res[k].s=res[L].s}
   else if(Rr>=0){res[k].x=res[Rr].x;res[k].y=res[Rr].y;res[k].s=res[Rr].s}}
  i=j}

/* ---- the pro tracking job ---- */
const _trackClip0=trackClip;
async function trackClipPro(c,retry){
 if(tracking)return;
 tracking=true;trkStop=false;pause();
 const e=c.el,D=dur(c),kind=c.tk||'auto',ultra=c.teng=='Ultra',
  dt=ultra?Math.min(.033,{Fast:.1,Normal:.05,Smooth:.033}[c.tdt||'Normal']):{Fast:.1,Normal:.05,Smooth:.033}[c.tdt||'Normal'],
  TW=Math.min(ultra?640:480,e.videoWidth),TH=Math.round(TW*e.videoHeight/e.videoWidth),
  Sb=({Small:18,Normal:30,Large:48}[c.trg||'Normal'])*1.34*Math.max(1,dt/.05)*(TW/480);
 c.trk=null;c.trkRaw=null;c._live=null;c._satp=null;let L0=0,ok0=false,again=false;
 try{
  L0=playheadClip(c);const t0=srcT(c,L0);await seekV(e,t0);let seed,ai=null;
  if(c._seed&&(kind=='tap'||c._seedUser||kind=='auto')){seed=c._seed}
  else{say('Scanning for target…');await sweepAnim();const r=await findSeed(c,kind,t0);ai=r.ai;seed=r.list[0]}
  if(!seed)throw new Error('no target found — tap the object on the preview');
  if(MD[kind]&&!ai&&(c._seedUser===false||!c._seed)&&MPd[MD[kind]])ai=MPd[MD[kind]];
  const R=Math.max(8,Math.min(Math.round(44*TW/480),Math.round((seed.s||.1)*TW/2))),sz0=seed.s||.1;
  const run=async dir=>{
   const out=[];await seekV(e,srcT(c,L0));let F=grabF(e,TW,TH);
   const px=clamp(seed.x*TW,R+2,TW-R-3),py=clamp(seed.y*TH,R+2,TH-R-3),st=P4init(F,px,py,R,Sb,ultra);let sz=sz0;
   for(let lt=L0+dir*dt;lt>=-1e-6&&lt<=D+1e-6;lt+=dir*dt){
    if(trkStop)break;
    await seekV(e,srcT(c,Math.max(0,lt)));F=grabF(e,TW,TH);
    const r=P4step(st,F);let a=null;
    if(ai){try{a=det(kind,ai,e)}catch(_){a=null}
     if(a){const ax=a.x*TW,ay=a.y*TH,dd=Math.hypot(ax-r.x,ay-r.y);
      if(!r.ok||(dd>.09*TW&&(++st.dis>=3||r.q<.7))){
       st.pos={x:clamp(ax,R,TW-R-1),y:clamp(ay,R,TH-R-1)};st.kx.p=st.pos.x;st.ky.p=st.pos.y;st.kx.v*=.3;st.ky.v*=.3;st.lost=0;st.dis=0;
       r.x=st.pos.x;r.y=st.pos.y;r.ok=true;r.q=.7}
      else{if(dd<=.09*TW)st.dis=0;st.pos.x+=.06*(ax-st.pos.x);st.pos.y+=.06*(ay-st.pos.y);r.x=st.pos.x;r.y=st.pos.y}}}
    sz=a?sz*.8+(a.s||sz)*.2:sz*.85+clamp(sz0*st.scale,.02,.8)*.15;
    out.push({t:srcT(c,Math.max(0,lt)),x:r.x/TW,y:r.y/TH,s:sz,q:r.q});

   return out};
  const fw=await run(1),bw=trkStop?[]:await run(-1);

  raw=cleanTrack(raw);c.trkRaw=raw;c.trkRef={x:seed.x,y:seed.y};reSmooth(c);
  const good=Math.round(raw.filter(p=>p.q>.5).length/raw.length*100);ok0=true;
  if(!c._fset){c.follow='on';c.fz=130;c._fset=1}
  if(good<55&&!retry&&!trkStop&&kind!='tap'&&!(c.teng=='Ultra'&&c.trg=='Large')){c.teng='Ultra';c.trg='Large';again=true;say('Lock '+good+'% only → retrying automatically with Ultra + Large range…')}
  else say('Pro tracking done ✓ '+good+'% of frames locked on.'+(good<60?' Tip: raise Target size or tap a more detailed point.':' Preview is playing; adjust Smoothness below.'))}
 catch(err){say('Tracking failed: '+(err.message||err))}
 tracking=false;c._live=null;c._satp=null;
 try{await seekV(e,srcT(c,L0))}catch(_){}

trackClip=function(c){return c&&c.teng=='Classic'?_trackClip0(c):trackClipPro(c)};

/* ---- one-tap auto track ---- */
async function autoTrack(c){
 if(tracking)return;
 if(!c._seed||c._seedUser===false){await scanNow(c)}
 if(c._seed)await trackClipPro(c)}

/* ---- smart zoom: no black edges ---- */
function autoZoom(c){
 if(!c.trkRaw||!c.trkRaw.length)return;
 const ref=c.fmode=='lock'&&c.trkRef?c.trkRef:{x:.5,y:.5};let dm=0;
 (c.trk||c.trkRaw).forEach(p=>{dm=Math.max(dm,Math.abs(p.x-ref.x),Math.abs(p.y-ref.y))});

/* ---- panel: extra Pro controls around the existing panel ---- */
const _tp4=trackPanel;
trackPanel=function(p,c,hd,chips){
 if(c.type!='video')return _tp4(p,c,hd,chips);
 c.teng=c.teng||'Pro';
 hd('⚡ Pro tracker');
 fld(p,'Engine',c,'teng','',['Classic','Pro','Ultra']);
 row(p,[['⚡ One-tap Auto Track',()=>autoTrack(c)]]);
 p.append(el('<p class=m>Pro = multi-point + Kalman + sub-pixel. Ultra = 8 points, 30fps sampling, hardest shots (fast motion, blur, partial hiding). If lock is under 55% it retries by itself.</p>'));
 _tp4(p,c,hd,chips);

  p.append(el('<p class=m>Track quality: <b>'+good+'%</b> locked · green dots = strong, yellow = interpolated, red = weak.</p>'));
  const ap=o=>{save();Object.assign(c,o);if(o.follow=='on')autoZoom(c);panel();rd()};
  row(p,[['🔒 Lock target (stabilize)',()=>ap({follow:'on',fmode:'lock'})],['🎯 Center on target',()=>ap({follow:'on',fmode:'center'})]]);
  row(p,[['✨ Auto zoom (no black edges)',()=>{save();autoZoom(c);panel();rd()}],['⏹ Follow off',()=>{save();c.follow='off';panel();rd()}]])}};

/* ---- overlay: confidence dots + live satellite points ---- */
const _dto=drawTrackOverlay;
drawTrackOverlay=function(L){
 _dto(L);
 if(rec||exporting||!(sheet&&tab=='track'))return;
 const c=L&&L.c;if(!c||c.type!='video'||!c._xf)return;
 const u=cv.width/300;x.save();x.filter='none';x.globalAlpha=1;x.globalCompositeOperation='source-over';
 if(c.trkRaw&&c.trkRaw.length){const a=c.trkRaw,step=Math.max(1,Math.floor(a.length/80));
  for(let i=0;i<a.length;i+=step){const q=a[i],p=toCv(c,q.x,q.y);x.fillStyle=q.q>.6?'#3ddc84':q.q>.3?'#ffd23f':'#ff4d4d';x.beginPath();x.arc(p.x,p.y,Math.max(1.5,u*1.6),0,7);x.fill()}}

})();

<script>
/* ===================== NAOL PATCH v5 — VIDEO QUALITY 50 PANEL =====================
   Panel haaraa "Quality 50" (🔷). Tool 50 — hundi isaa dhugaan video irratti hojjata:
   Light 1-10 · Color 11-20 · Detail 21-30 · Look 31-40 · Finish 41-50
   Engine: SVG filter (LUT per channel + unsharp masks + blur mixes + channel shift + bloom) — preview fi export lamaan irratti.
   Qabeenya hundi c.f.q_* keessatti kuufama (project save, undo, apply-to-all ofumaan hojjata).
================================================================================ */
(()=>{
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),c01=v=>v<0?0:v>1?1:v;

 tmp:0,tin:0,sat:100,vib:0,hue:0,rg:0,gg:0,bg:0,fad:0,sdt:0,
 shp:0,ssh:0,cla:0,tex:0,det:0,edg:0,dn:0,sf:0,dbk:0,aa:0,

/* ---------- tone curve → per-channel LUT (tools 1-10, 11-12, 16-20, 36-38, 40, 42) ---------- */
function lut(f,ch){

  hz=g('hz')/100,ll=g('ll')/100,gam=g('gam'),con=g('con')/100,byp=g('byp')/100,scv=g('scv')/100,fad=g('fad')/100,ro=g('ro')/100,
  tmp=g('tmp')/100,tin=g('tin')/100,rg=g('rg')/100,gg=g('gg')/100,bg=g('bg')/100,sdt=g('sdt')/100,sth=g('sth')/100,to=g('to')/100;

  if(con)v=c01((v-.5)*(1+con*.8)+.5);
  if(byp)v=c01((v-.5)*(1+byp*.45)+.5);
  if(scv)v=v+(v*v*(3-2*v)-v)*scv;
  if(fad){const fa=fad*.14;v=fa+v*(1-fa*1.5)}
  if(ro){const t=1-ro*.45;if(v>t)v=t+(1-t)*Math.tanh((v-t)/(1-t))}

  const sh=Math.pow(1-v,2),hi=v*v;

/* synth engine: understands the extra options (arpeggio, repeat, vibrato, filter, noise layer …) */
function sfxVoice(c,dest,ty,a,b,d,T,O,gv){
 const g=c.createGain(),att=Math.min(O.att||.004,d*.6);
 g.gain.setValueAtTime(.0001,T);
 if(O.sw){g.gain.exponentialRampToValueAtTime(gv,T+d*.92);g.gain.linearRampToValueAtTime(.0001,T+d)}
 else{g.gain.exponentialRampToValueAtTime(gv,T+att);if(O.hold&&d*O.hold>att)g.gain.setValueAtTime(gv,T+d*O.hold);g.gain.exponentialRampToValueAtTime(.001,T+d)}
 g.connect(dest);
 const flt=(type,f,q)=>{const x=c.createBiquadFilter();x.type=type;x.frequency.value=f;x.Q.value=q||1;return x};
 const nbuf=len=>{const bf=c.createBuffer(1,Math.max(1,len),c.sampleRate),da=bf.getChannelData(0);for(let i=0;i<da.length;i++)da[i]=Math.random()*2-1;return bf};
 let head=g,src;
 if(ty=='noise'){
  src=c.createBufferSource();src.buffer=nbuf(Math.floor(c.sampleRate*(d+.03)));
  const x=flt(O.ft||'bandpass',a,O.q);x.frequency.setValueAtTime(a,T);x.frequency.exponentialRampToValueAtTime(Math.max(20,b),T+d);
  src.connect(x);x.connect(g)}
 else{
  if(O.ft){const x=flt(O.ft,O.fq||2000,O.q);x.connect(g);head=x}
  src=c.createOscillator();src.type=ty;src.frequency.setValueAtTime(Math.max(1,a),T);src.frequency.exponentialRampToValueAtTime(Math.max(1,b),T+d);src.connect(head);
  if(O.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=O.vib;lg.gain.value=O.vd||30;l.connect(lg);lg.connect(src.frequency);l.start(T);l.stop(T+d+.03)}
  if(O.h){const s2=c.createOscillator(),g2=c.createGain();s2.type='sine';s2.frequency.setValueAtTime(Math.max(1,a*O.h),T);s2.frequency.exponentialRampToValueAtTime(Math.max(1,b*O.h),T+d);g2.gain.value=.5;s2.connect(g2);g2.connect(head);s2.start(T);s2.stop(T+d+.03)}}
 if(O.nz){const ns=c.createBufferSource();ns.buffer=nbuf(Math.floor(c.sampleRate*(d*.6+.03)));const nf=flt(O.nt||'lowpass',O.nf||2000,.7),ng=c.createGain();
  ng.gain.setValueAtTime(O.nz,T);ng.gain.exponentialRampToValueAtTime(.001,T+d*.6);ns.connect(nf);nf.connect(ng);ng.connect(g);ns.start(T);ns.stop(T+d*.6+.03)}
 src.start(T);src.stop(T+d+.03)}
window.sfxSynth=function(c,dest,n,T0){
 const E=SFX[n]||SFXLIB[n];if(!E)return;const ty=E[0],f0=E[1],f1=E[2],d=E[3],O=E[4]||{},gv=O.g==null?.5:O.g,seq=O.seq,cnt=seq?seq.length:(O.rep||1),step=seq?(O.st||.08):(O.gap||d);
 for(let i=0;i<cnt;i++){const T=T0+i*step+(O.rnd?Math.random()*O.rnd:0),a=seq?seq[i]:f0,b=seq?seq[i]*(O.sl||1):f1;sfxVoice(c,dest,ty,a,b,d,T,O,gv)}};

function spEditor(p,c,cb){
 const sc=c.sc,W=600,H=210,X0=18,X1=W-18,Y0=16,Y1=H-16,CL=(v,a,b)=>Math.max(a,Math.min(b,v));
 const yOf=s=>Y0+(1-(Math.log10(CL(s,.1,10))+1)/2)*(Y1-Y0),sOf=y=>Math.pow(10,(1-(y-Y0)/(Y1-Y0))*2-1),xOf=u=>X0+u*(X1-X0);
 const root=el(`<div class=sped><div class=spe1><span class=spd></span><button class=ic id=spPlay>▶</button><button class="b spdel" id=spAdd>＋ Add beat</button></div>
  <svg viewBox="0 0 ${W} ${H}"></svg>
  <div class=spe3><button class=b id=spReset>↺ Reset</button><b>${sc.name||'Custom'}</b><button class=ic id=spOk>✓</button></div></div>`);
 p.append(root);
 const svg=root.querySelector('svg'),info=root.querySelector('.spd'),bPlay=root.querySelector('#spPlay'),bAdd=root.querySelector('#spAdd');
 const upI=()=>{info.innerHTML=`Duration: <span>${(c.out-c.in).toFixed(1)}s</span> <b>➜</b> <strong>${dur(c).toFixed(1)}s</strong>`};
 const upB=()=>{const last=sc.pts.length-1,ok=SPsel>0&&SPsel<last;if(SPsel>=0){bAdd.textContent='− Delete beat';bAdd.style.opacity=ok?1:.4}else{bAdd.textContent='＋ Add beat';bAdd.style.opacity=1}};
 const render=()=>{
  let h=`<rect x=${X0-8} y=${Y0-8} width=${X1-X0+16} height=${Y1-Y0+16} fill=none stroke="#555"/>`;
  [[10,'10x',0],[1,'1x',0],[.1,'0.1x',0]].forEach(([s,l])=>{h+=`<text x=${X0+8} y=${yOf(s)+(s==10?14:s==.1?-5:-4)} fill="#777" font-size=13>${l}</text>`});
  h+=`<line x1=${X0-8} x2=${X1+8} y1=${yOf(1)} y2=${yOf(1)} stroke="#555"/>`;
  [5,.2].forEach(s=>{h+=`<line x1=${X0-8} x2=${X1+8} y1=${yOf(s)} y2=${yOf(s)} stroke="#555" stroke-dasharray="6 6"/>`});
  let d='';for(let i=0;i<=120;i++){const u=i/120;d+=(i?'L':'M')+xOf(u).toFixed(1)+' '+yOf(scG(sc.pts,u)).toFixed(1)}
  h+=`<path d="${d}" fill=none stroke="#fc0" stroke-width=2.5 />`;
  h+=`<line x1=${xOf(SPph)} x2=${xOf(SPph)} y1=${Y0-8} y2=${Y1+8} stroke="#fff" stroke-width=3 />`;
  h+=`<circle cx=${xOf(SPph)} cy=${yOf(scG(sc.pts,SPph))} r=13 fill="#fff" />`;
  sc.pts.forEach((a,i)=>{if(i==0&&SPph<.01)return;h+=`<circle cx=${xOf(a[0])} cy=${yOf(a[1])} r=11 fill="${i==SPsel?'#fff':'#000'}" stroke="${i==SPsel?'#fc0':'#fff'}" stroke-width=3 />`});
  svg.innerHTML=h;upI();upB()};
 const pt=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
 const scrub=()=>{if(playing)pause();t=startOf(c)+ltOfU(c,SPph);ign=performance.now();$('#sc').scrollLeft=t*PX;rd();$('#tc').textContent=fmt(t)+' / '+fmt(total())};
 let drag=null;
 svg.onpointerdown=e=>{const q=pt(e);let best=-1,bd=28;sc.pts.forEach((a,i)=>{const dd=Math.hypot(xOf(a[0])-q.x,yOf(a[1])-q.y);if(dd<bd){bd=dd;best=i}});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(best>=0){save();SPsel=best;drag=best;SPph=sc.pts[best][0];scrub()}else{SPsel=-1;drag=-2;SPph=CL((q.x-X0)/(X1-X0),0,1);scrub()}render()};
 svg.onpointermove=e=>{if(drag==null)return;const q=pt(e);
  if(drag>=0){const a=sc.pts[drag],n=sc.pts.length;let s=CL(sOf(q.y),.1,10);if(Math.abs(Math.log10(s))<.04)s=1;a[1]=s;
   if(drag>0&&drag<n-1)a[0]=CL((q.x-X0)/(X1-X0),sc.pts[drag-1][0]+.02,sc.pts[drag+1][0]-.02);SPph=a[0];sc.v=(sc.v||0)+1;if(!/^Custom/.test(sc.name||''))sc.name='Custom'}
  else SPph=CL((q.x-X0)/(X1-X0),0,1);
  scrub();render()};
 svg.onpointerup=svg.onpointercancel=()=>{if(drag==null)return;drag=null;sc.v=(sc.v||0)+1;tl();upd(true);rd();render()};
 bAdd.onclick=()=>{const last=sc.pts.length-1;
  if(SPsel>=0){if(SPsel>0&&SPsel<last){save();sc.pts.splice(SPsel,1);SPsel=-1;sc.v=(sc.v||0)+1;sc.name='Custom';tl();rd();render()}return}
  const near=sc.pts.findIndex(a=>Math.abs(a[0]-SPph)<.015);if(near>=0){SPsel=near;render();return}
  save();const y=scG(sc.pts,SPph);let i=sc.pts.findIndex(a=>a[0]>SPph);if(i<0)i=sc.pts.length;sc.pts.splice(i,0,[SPph,y]);SPsel=i;sc.v=(sc.v||0)+1;tl();render()};
 let raf=0;
 const loop=()=>{if(!playing||!SPE){bPlay.textContent='▶';return}const L=loc(t);if(!L||L.c!==c){pause();bPlay.textContent='▶';return}SPph=uOfLt(c,L.lt);render();raf=requestAnimationFrame(loop)};
 bPlay.onclick=()=>{if(playing){pause();bPlay.textContent='▶';return}t=startOf(c)+ltOfU(c,SPph>=.995?0:SPph);play();bPlay.textContent='⏸';raf=requestAnimationFrame(loop)};

/* ---------------- generate ---------------- */
async function generate(){
 if(busy)return;
 if(!clips.some(c=>c.type=='video')){cmsg('First add a video with ＋ (captions need a voice track).',0);return}
 if(CF.eng=='whisper'&&CF.lang=='om'){cmsg('Whisper does not know Afaan Oromoo. Choose “AI Server” (your own Oromo model) or “My text → voice sync”.',0);return}
 if(CF.eng=='sync'&&!CF.text.trim()){cmsg('Type or paste your text first (one line = one caption group).',0);return}
 if(CF.eng=='server'&&!CF.url.trim()){cmsg('Enter your AI server URL first.',0);return}
 busy=true;cancel=false;const my=++gtok;setBusy(true);
 try{
  cmsg('Reading the voice track…',5);
  const full=await mixVoice();if(cancel||my!=gtok)throw'cancel';
  const SR=16000;let a=0,b=total();if(CF.scope=='clip'&&selC){a=startOf(selC);b=Math.min(b,a+dur(selC))}
  const seg=full.slice(Math.floor(a*SR),Math.min(full.length,Math.ceil(b*SR)));
  cmsg('Finding where the voice speaks…',15);
  const vs=vad(seg,SR).map(s=>[s[0]+a,s[1]+a]);
  if(!vs.length)throw new Error('No speech found in this range (is the clip muted/silent?).');
  let words;
  if(CF.eng=='sync'){cmsg('Syncing your text to the voice…',60);words=syncText(CF.text,vs)}
  else if(CF.eng=='whisper')words=await runWhisper(seg,a,vs);
  else words=await runServer(seg,a,vs);
  if(cancel||my!=gtok)throw'cancel';
  if(!words.length)throw new Error('No words were recognised.');
  const nc=build(words);csnap();
  caps=caps.filter(k=>k.end<=a+.01||k.start>=b-.01).concat(nc).sort((p,q)=>p.start-q.start);capSel=nc[0]||null;dirty=true;
  busy=false;cmsg('✓ '+nc.length+' captions ready — pick a template below.',100);
  tl();t=Math.max(0,nc[0].start);upd();rd();
  const lb=document.getElementById('caplist');if(lb)renderList(lb)
 }catch(e){busy=false;if(e==='cancel')cmsg('Cancelled.',0);else cmsg('⚠ '+(e&&e.message||e),0)}
 finally{busy=false;setBusy(false)}}

<script>

 e.onloadedmetadata=()=>{if(e.duration===Infinity){e.ontimeupdate=()=>{e.ontimeupdate=null;fin(e.duration)};try{e.currentTime=1e7}catch(_){fin(0)}}else fin(e.duration)};

/* ---------------- audio elements / tracks ---------------- */
async function mkEl(a){
 if(a.kind=='dev')return true;
 const b=await idbGet('files',a.fid);if(!b)return false;
 const e=new Audio();e.preload='auto';e.src=URL.createObjectURL(b);
 try{e.preservesPitch=true}catch(_){}
 e.playbackRate=a.rate||1;e.volume=clamp(a.vol,0,1);a.el=e;
 try{route(e)}catch(_){}
 return true}
async function addTrack(o){
 let fid=o.fid;
 if(!fid&&o.blob){fid='au'+Date.now()+'_'+aid;await idbPut('files',fid,o.blob)}
 const a={id:aid++,kind:o.kind,name:o.name||'Audio',fid,at:Math.max(0,o.at||0),in:o.in||0,len:Math.max(.2,o.len||1),src:o.src||0,vol:o.vol==null?1:o.vol,rate:o.rate||1,fi:0,fo:0};
 if(o.kind=='dev'){a.text=o.text;a.voice=o.voice;a.srate=o.srate||1}
 if(!await mkEl(a)){say('Could not load this audio');return null}
 atr.push(a);asel=a;persist(true);tl();return a}
function gainAt(a,tt){let g=a.vol;if(a.fi>0)g*=clamp((tt-a.at)/a.fi,0,1);if(a.fo>0)g*=clamp((a.at+a.len-tt)/a.fo,0,1);return clamp(g,0,1)}

 const v=speechSynthesis.getVoices().find(z=>z.voiceURI==a.voice);if(v){u.voice=v;u.lang=v.lang}speechSynthesis.speak(u)}catch(_){}}

/* ---------------- playback sync ---------------- */
function sync(){

  if(a.kind=='dev'){if(playing&&t>=a.at&&t<a.at+a.len&&!a._sp){a._sp=1;speakDev(a)}if(t<a.at)a._sp=0;return}
  const e=a.el;if(!e)return;
  if(playing&&t>=a.at-.02&&t<a.at+a.len){
   const want=Math.max(0,a.in+(t-a.at)*a.rate),lim=a.src||e.duration||1e9;
   if(want>=lim-.03){if(!e.paused)e.pause();return}
   e.volume=gainAt(a,t);
   if(e.paused){try{e.currentTime=want}catch(_){}e.play().catch(()=>{})}
   else if(Math.abs(e.currentTime-want)>.4){try{e.currentTime=want}catch(_){}}
